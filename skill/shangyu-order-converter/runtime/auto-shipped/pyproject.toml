[project]
name = "auto-shipped"
version = "0.1.0"
description = "Modular order normalization and Guanyi ERP automation for Shangyu"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
]

[project.scripts]
auto-shipped = "auto_shipped.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

